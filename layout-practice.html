<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex 练习</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: #3498db;
            border: 2px solid #2980b9;
            color: white;
            font-size: 24px;

            line-height: 100px;
            text-align: center;
        }

        .container {
            background-color: #eee;
            height: 300px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="box">1</div>
        <div class="box">2</div>
        <div class="box">3</div>
    </div>

</body>
</html>
